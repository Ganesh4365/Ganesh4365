<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="75%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.4; r: 5px; }
      50% { opacity: 1; r: 7px; }
    }
    @keyframes flow {
      from { stroke-dashoffset: 160; }
      to { stroke-dashoffset: 0; }
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    .animated-track {
      stroke-dasharray: 10 8;
      animation: flow 10s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #38bdf8;
    }
    .node-header {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #f8fafc;
    }
    .node-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 10px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #4ade80;
    }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="846" height="156" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Terminal Title Bar -->
  <circle cx="28" cy="28" r="5.5" fill="#ef4444" />
  <circle cx="46" cy="28" r="5.5" fill="#f59e0b" />
  <circle cx="64" cy="28" r="5.5" fill="#10b981" />
  <text x="88" y="32" class="title-text">CONTINUOUS GITOPS &amp; CLOUD DEPLOYMENT PIPELINE</text>
  <circle cx="782" cy="28" r="5" fill="#4ade80" class="pulse-dot" />
  <text x="795" y="32" class="status-text">LIVE</text>

  <!-- Connecting Pipeline Rail -->
  <line x1="85" y1="95" x2="765" y2="95" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <line x1="85" y1="95" x2="765" y2="95" stroke="url(#trackGrad)" stroke-width="3" stroke-linecap="round" class="animated-track" filter="url(#neon)" />

  <!-- Node 1: Code Commit -->
  <g transform="translate(85, 95)">
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#38bdf8" />
    <text x="0" y="-28" text-anchor="middle" class="node-header">1. Commit</text>
    <text x="0" y="34" text-anchor="middle" class="node-subtitle">Git / GitHub</text>
  </g>

  <!-- Node 2: CI & Tests -->
  <g transform="translate(221, 95)">
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#818cf8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#818cf8" />
    <text x="0" y="-28" text-anchor="middle" class="node-header">2. CI Test</text>
    <text x="0" y="34" text-anchor="middle" class="node-subtitle">GitHub Actions</text>
  </g>

  <!-- Node 3: DevSecOps Scan -->
  <g transform="translate(357, 95)">
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#f43f5e" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#f43f5e" />
    <text x="0" y="-28" text-anchor="middle" class="node-header">3. Security</text>
    <text x="0" y="34" text-anchor="middle" class="node-subtitle">Sonar &amp; Trivy</text>
  </g>

  <!-- Node 4: Docker Registry -->
  <g transform="translate(493, 95)">
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#c084fc" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#c084fc" />
    <text x="0" y="-28" text-anchor="middle" class="node-header">4. Artifact</text>
    <text x="0" y="34" text-anchor="middle" class="node-subtitle">Docker / ECR</text>
  </g>

  <!-- Node 5: ArgoCD GitOps -->
  <g transform="translate(629, 95)">
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#fb923c" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#fb923c" />
    <text x="0" y="-28" text-anchor="middle" class="node-header">5. GitOps</text>
    <text x="0" y="34" text-anchor="middle" class="node-subtitle">ArgoCD Sync</text>
  </g>

  <!-- Node 6: Kubernetes Cluster -->
  <g transform="translate(765, 95)">
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#4ade80" stroke-width="3" filter="url(#neon)" />
    <circle cx="0" cy="0" r="7" fill="#4ade80" class="pulse-dot" />
    <text x="0" y="-30" text-anchor="middle" class="node-header">6. Cluster</text>
    <text x="0" y="36" text-anchor="middle" class="node-subtitle">K8s &amp; HPA</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140" style="background: transparent;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" />
      <stop offset="50%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: flow 15s linear infinite;
    }
    @keyframes flow {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 2px;
      fill: #58a6ff;
    }
    .node-text {
      font-family: "Fira Code", monospace, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #c9d1d9;
    }
    .node-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 9px;
      fill: #8b949e;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="136" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Header Bar -->
  <circle cx="24" cy="24" r="5" fill="#f85149" />
  <circle cx="40" cy="24" r="5" fill="#e3b341" />
  <circle cx="56" cy="24" r="5" fill="#2ea043" />
  <text x="80" y="28" class="text-title">CONTINUOUS GITOPS &amp; CLOUD DEPLOYMENT PIPELINE</text>
  <circle cx="780" cy="24" r="4" fill="#3fb950" class="pulse-dot" />
  <text x="792" y="28" font-family="monospace" font-size="11" fill="#3fb950" font-weight="bold">ACTIVE</text>

  <!-- Animated Pipeline Track -->
  <line x1="75" y1="85" x2="775" y2="85" stroke="#21262d" stroke-width="4" stroke-linecap="round" />
  <line x1="75" y1="85" x2="775" y2="85" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" class="flow-line" filter="url(#glow)" />

  <!-- Node 1: Code -->
  <g transform="translate(85, 85)">
    <circle cx="0" cy="0" r="16" fill="#161b22" stroke="#388bfd" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#388bfd" />
    <text x="0" y="-24" text-anchor="middle" class="node-text">Code</text>
    <text x="0" y="28" text-anchor="middle" class="node-sub">Git / GitHub</text>
  </g>

  <!-- Node 2: CI / Test -->
  <g transform="translate(225, 85)">
    <circle cx="0" cy="0" r="16" fill="#161b22" stroke="#e3b341" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#e3b341" />
    <text x="0" y="-24" text-anchor="middle" class="node-text">CI Test</text>
    <text x="0" y="28" text-anchor="middle" class="node-sub">Jenkins / Actions</text>
  </g>

  <!-- Node 3: DevSecOps -->
  <g transform="translate(365, 85)">
    <circle cx="0" cy="0" r="16" fill="#161b22" stroke="#f85149" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#f85149" />
    <text x="0" y="-24" text-anchor="middle" class="node-text">Security</text>
    <text x="0" y="28" text-anchor="middle" class="node-sub">SonarQube &amp; Trivy</text>
  </g>

  <!-- Node 4: Artifact / Registry -->
  <g transform="translate(505, 85)">
    <circle cx="0" cy="0" r="16" fill="#161b22" stroke="#a371f7" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#a371f7" />
    <text x="0" y="-24" text-anchor="middle" class="node-text">Artifact</text>
    <text x="0" y="28" text-anchor="middle" class="node-sub">Docker / ECR</text>
  </g>

  <!-- Node 5: GitOps Sync -->
  <g transform="translate(645, 85)">
    <circle cx="0" cy="0" r="16" fill="#161b22" stroke="#f0883e" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#f0883e" />
    <text x="0" y="-24" text-anchor="middle" class="node-text">GitOps</text>
    <text x="0" y="28" text-anchor="middle" class="node-sub">ArgoCD Sync</text>
  </g>

  <!-- Node 6: Production K8s -->
  <g transform="translate(775, 85)">
    <circle cx="0" cy="0" r="18" fill="#161b22" stroke="#2ea043" stroke-width="2.5" />
    <circle cx="0" cy="0" r="7" fill="#2ea043" class="pulse-dot" />
    <text x="0" y="-26" text-anchor="middle" class="node-text">Cluster</text>
    <text x="0" y="30" text-anchor="middle" class="node-sub">Kubernetes / HPA</text>
  </g>
</svg>

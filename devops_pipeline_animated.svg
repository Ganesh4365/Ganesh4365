<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 320" width="100%" height="320">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes codeScroll { 0% { stroke-dashoffset: 60; } 100% { stroke-dashoffset: 0; } }
    .blink { animation: blink 1.5s infinite ease-in-out; }
    .code-line { stroke-dasharray: 8 4; animation: codeScroll 4s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="450" height="320" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Server Rack / Cloud Cloud Accent -->
  <g transform="translate(330, 40)" opacity="0.8">
    <rect width="80" height="130" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <!-- Rack Units -->
    <rect x="8" y="15" width="64" height="20" rx="4" fill="#1e293b"/>
    <circle cx="18" cy="25" r="3" fill="#22c55e" class="blink"/>
    <circle cx="28" cy="25" r="3" fill="#38bdf8"/>
    
    <rect x="8" y="45" width="64" height="20" rx="4" fill="#1e293b"/>
    <circle cx="18" cy="55" r="3" fill="#22c55e"/>
    <circle cx="28" cy="55" r="3" fill="#eab308" class="blink"/>

    <rect x="8" y="75" width="64" height="20" rx="4" fill="#1e293b"/>
    <circle cx="18" cy="85" r="3" fill="#22c55e" class="blink"/>
    <circle cx="28" cy="85" r="3" fill="#38bdf8"/>

    <text x="40" y="115" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">AWS CLOUD</text>
  </g>

  <!-- Desk Surface -->
  <rect x="30" y="210" width="390" height="12" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="50" y="222" width="16" height="75" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="384" y="222" width="16" height="75" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

  <!-- Dual Monitor 1 (Main Left) -->
  <rect x="60" y="70" width="140" height="100" rx="6" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="68" y="78" width="124" height="84" rx="4" fill="#020617"/>
  <!-- Code on Screen 1 -->
  <text x="75" y="93" font-family="monospace" font-size="9" fill="#38bdf8">&gt; terraform apply</text>
  <line x1="75" y1="105" x2="160" y2="105" stroke="#4ade80" stroke-width="2" class="code-line"/>
  <line x1="75" y1="117" x2="180" y2="117" stroke="#94a3b8" stroke-width="2"/>
  <line x1="75" y1="129" x2="140" y2="129" stroke="#94a3b8" stroke-width="2"/>
  <text x="75" y="148" font-family="monospace" font-size="8" fill="#22c55e">✓ Apply complete: 12 added</text>
  <rect x="120" y="170" width="20" height="40" fill="#334155"/>
  <rect x="105" y="206" width="50" height="4" rx="2" fill="#475569"/>

  <!-- Dual Monitor 2 (Right Dashboard) -->
  <rect x="210" y="85" width="115" height="85" rx="6" fill="url(#screenGrad)" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="216" y="91" width="103" height="73" rx="4" fill="#020617"/>
  <!-- Grafana Graph on Screen 2 -->
  <text x="222" y="103" font-family="monospace" font-size="8" fill="#818cf8">K8s Cluster Status</text>
  <path d="M 222 135 Q 240 120, 260 130 T 290 115 T 310 125" fill="none" stroke="#f43f5e" stroke-width="2"/>
  <rect x="222" y="145" width="40" height="12" rx="2" fill="#1e293b"/>
  <text x="226" y="154" font-family="monospace" font-size="7" fill="#4ade80">Pods: 100%</text>
  <rect x="260" y="170" width="15" height="40" fill="#334155"/>
  <rect x="247" y="206" width="40" height="4" rx="2" fill="#475569"/>

  <!-- Mechanical Keyboard & Mouse -->
  <rect x="130" y="215" width="90" height="6" rx="2" fill="#475569"/>
  <ellipse cx="240" cy="218" rx="6" ry="4" fill="#64748b"/>

  <!-- Coffee Mug -->
  <rect x="90" y="212" width="12" height="14" rx="2" fill="#f8fafc"/>
  <path d="M 102 215 Q 107 218, 102 222" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="96" y="208" font-size="10" text-anchor="middle" class="blink">☕</text>

  <!-- Bottom Terminal Status Bar -->
  <rect x="20" y="278" width="410" height="28" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
  <circle cx="35" cy="292" r="4" fill="#22c55e" class="blink"/>
  <text x="46" y="296" font-family="monospace" font-size="10" fill="#94a3b8">INFRASTRUCTURE STATUS: <tspan fill="#38bdf8">99.9% UPTIME</tspan> | CLOUD: <tspan fill="#4ade80">HEALTHY</tspan></text>
</svg>
